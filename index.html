.t-dark{--bg:#0F0F0D;--fg:#ECE7DE;--mute:#9C958A;--body:#CFC9BE;--line:rgba(236,231,222,.18);--inv:1}
.t-light{--bg:#ECE7DE;--fg:#0F0F0D;--mute:#5E5850;--body:#3F3B35;--line:rgba(15,15,13,.18);--inv:0}
.sec{background:var(--bg);color:var(--fg)}
.page{background:#0F0F0D;transition:background-color .8s ease}
.page.live .sec{background:transparent}
.page.live.is-dark{background:#0F0F0D}
.page.live.is-light{background:#ECE7DE}
.page.live.is-dark .sec{--bg:#0F0F0D;--fg:#ECE7DE;--mute:#9C958A;--body:#CFC9BE;--line:rgba(236,231,222,.18);--inv:1}
.page.live.is-light .sec{--bg:#ECE7DE;--fg:#0F0F0D;--mute:#5E5850;--body:#3F3B35;--line:rgba(15,15,13,.18);--inv:0}
.sec,.sec *{transition:color .8s ease,background-color .8s ease,border-color .8s ease,filter .8s ease}
.logo{filter:invert(var(--inv))}
.client{filter:brightness(0) invert(var(--inv));opacity:.85}
@keyframes blink{50%{opacity:0}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
.caret{display:inline-block;width:.07em;height:.78em;background:currentColor;margin-left:.04em;vertical-align:-0.04em;animation:blink 1s steps(1) infinite}
.card{text-decoration:none;color:var(--fg);display:flex;flex-direction:column;gap:10px}
.card:hover{opacity:1}
.card .cover{transition:transform .6s cubic-bezier(.2,.7,.2,1)}
.card:hover .cover{transform:scale(1.015)}
.card .arrow{transition:transform .3s ease}
.card:hover .arrow{transform:rotate(45deg)}
.svc{display:flex;flex-wrap:wrap;gap:12px 40px;align-items:baseline;padding:32px 0;border-top:1px solid var(--line);color:var(--fg);text-decoration:none;transition:padding .3s ease}
.svc:hover{opacity:1;padding-left:16px}
.marquee{display:flex;align-items:center;width:max-content;animation:marquee 40s linear infinite}
.field{display:flex;flex-direction:column;gap:8px;flex:1 1 260px}
.field label{font-size:14px;font-weight:300;letter-spacing:1px;color:var(--mute)}
.field input,.field select,.field textarea{font:inherit;font-size:16px;font-weight:300;color:var(--fg);background:transparent;border:0;border-bottom:1px solid var(--fg);padding:12px 0;min-height:48px;border-radius:0}
.field select option{color:#0F0F0D}
.field textarea{min-height:110px;resize:vertical}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-bottom-width:2px}
.social{display:inline-flex;align-items:center;justify-content:center;width:52px;height:44px;border:1px solid var(--fg);border-radius:999px;color:var(--fg)}
.social:hover{opacity:1;background:var(--fg);color:var(--bg)}
.sitemap a{font-size:16px;font-weight:400;text-decoration:underline;text-underline-offset:3px}
.combo-btn{display:inline-flex;align-items:center;min-height:52px;padding:0 28px;border-radius:999px;background:#DBED17;color:#070905;text-decoration:none;font-weight:500;font-size:16px}
.combo-btn:hover{opacity:.88;color:#070905}
.float-outer{transition:transform .35s cubic-bezier(.2,.7,.2,1);will-change:transform}
.float-inner{animation:bob 6s ease-in-out infinite}
.btn-solid{display:inline-flex;align-items:center;gap:10px;min-height:52px;padding:0 28px;border-radius:999px;background:var(--fg);color:var(--bg);text-decoration:none;font-weight:400;font-size:16px}
.btn-line{display:inline-flex;align-items:center;min-height:52px;padding:0 28px;border-radius:999px;border:1px solid var(--fg);color:var(--fg);text-decoration:none;font-weight:400;font-size:16px}
.label{margin:0;font-size:14px;font-weight:300;letter-spacing:1px;color:var(--mute)}
.arrow-dot{position:absolute;right:14px;top:14px;width:48px;height:48px;border-radius:50%;background:#ECE7DE;color:#0F0F0D;display:flex;align-items:center;justify-content:center;font-size:22px}
.cover-box{position:relative;border-radius:16px;overflow:hidden}
.cover-box img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.dot{width:44px;height:44px;border:0;background:transparent;padding:0;cursor:pointer;display:flex;align-items:center;justify-content:center}
.dot span{display:block;width:32px;height:2px;border-radius:2px;background:var(--line)}
.dot[aria-pressed="true"] span{background:var(--fg)}
@media (prefers-reduced-motion:reduce){.marquee,.float-inner,.caret{animation:none}}
