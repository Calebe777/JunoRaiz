<style>
body{background:#121212}
@keyframes rise{from{opacity:0;transform:translateY(32px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes spin{to{transform:rotate(360deg)}}
.carousel{overflow:hidden;-webkit-mask-image:linear-gradient(90deg,transparent,#000 12%,#000 88%,transparent);mask-image:linear-gradient(90deg,transparent,#000 12%,#000 88%,transparent)}
.track{display:flex;width:max-content;animation:marquee 45s linear infinite}
.carousel:hover .track{animation-play-state:paused}
.track img{width:clamp(180px,18vw,240px);aspect-ratio:4/5;object-fit:cover;border-radius:10px;display:block;flex:0 0 auto;margin-right:12px;background:#171717}
.spark{animation:spin 14s linear infinite}
.pcard{all:unset;cursor:pointer;display:block;border-radius:6px}
.pcard:focus-visible{outline:2px solid #E0F11F;outline-offset:6px}
.pcover{position:relative;aspect-ratio:3/2;border-radius:6px;overflow:hidden}
.pcover img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;transition:transform .5s cubic-bezier(.2,.7,.2,1)}
.pcard:hover .pcover img{transform:scale(1.03)}
.pview{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:flex-end;gap:6px;padding:24px;background:linear-gradient(180deg,rgba(18,18,18,0) 35%,rgba(18,18,18,.9));opacity:0;transition:opacity .25s ease}
.pcard:hover .pview,.pcard:focus-visible .pview{opacity:1}
@media (hover:none){.pview{opacity:1}}
.lime-btn{display:inline-flex;align-items:center;gap:10px;min-height:56px;padding:0 32px;border-radius:999px;background:#E0F11F;color:#121212;text-decoration:none;font-weight:500;font-size:16px}
.lime-btn:hover{color:#121212;opacity:.88}
.overlay{position:fixed;inset:0;z-index:100;background:rgba(8,8,7,.86);overflow-y:auto;padding:clamp(16px,4vw,56px) clamp(8px,3vw,40px);animation:fade .25s ease}
.overlay[hidden]{display:none}
.sheet{max-width:1120px;margin:0 auto;background:#F0F0F0;color:#121212;border-radius:20px;overflow:hidden;animation:rise .45s cubic-bezier(.2,.7,.2,1)}
.mbtn{min-height:48px;padding:0 22px;border-radius:999px;font:inherit;font-size:15px;font-weight:400;cursor:pointer;border:1px solid #121212;background:transparent;color:#121212}
.closebtn{position:fixed;top:16px;right:16px;z-index:2;width:48px;height:48px;border-radius:50%;border:0;background:#F0F0F0;color:#121212;cursor:pointer;display:flex;align-items:center;justify-content:center}
body.modal-open{overflow:hidden}
@media (prefers-reduced-motion:reduce){.track,.spark{animation:none}}
</style>
